name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,extended]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check src tests

      - name: Type check (mypy)
        # Blocking as of 2026-09-05: the pre-existing 24-error legacy debt
        # that justified running this as advisory-only is fixed (see
        # docs/155_engineering_debt_cleanup_20260905.md). disallow_untyped_defs
        # stays false (gradual typing), but a *regression* now fails CI.
        run: mypy src

      - name: Tests + coverage
        run: pytest --cov=src --cov-report=term-missing
